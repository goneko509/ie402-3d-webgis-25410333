<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mockup WebGIS 3D Cây xanh</title>
<style>
  :root {
    --green: #2e7d32; --green-d: #1b5e20; --green-l: #e8f5e9; --line: #d5dbd5; --text: #1f2a1f; --muted: #5f6b5f;
    --panel: #ffffff; --bg: #f3f5f2; --badge: #d32f2f; --admin: #8a4b08;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: var(--text); background: var(--bg); }
  .app { width: 1600px; height: 960px; position: relative; overflow: hidden; display: grid;
         grid-template-rows: 60px 1fr; grid-template-columns: 270px 1fr 350px; }
  header { grid-column: 1 / 4; display: flex; align-items: center; gap: 18px; padding: 0 20px;
           background: var(--green-d); color: #fff; position: relative; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 19px; white-space: nowrap; }
  .brand small { display: block; font-weight: 400; font-size: 13px; opacity: .85; }
  .leaf { width: 34px; height: 34px; border-radius: 50% 0 50% 0; background: #8bc34a; transform: rotate(45deg); }
  .search { position: relative; margin-left: 30px; flex: 0 0 470px; }
  .search input { width: 100%; height: 38px; border-radius: 19px; border: none; padding: 0 44px 0 18px; font-size: 15px; font-family: inherit; }
  .search .ico { position: absolute; right: 14px; top: 8px; width: 18px; height: 18px; border: 2.5px solid #555; border-radius: 50%; }
  .search .ico::after { content: ""; position: absolute; width: 8px; height: 2.5px; background: #555; right: -7px; bottom: -4px; transform: rotate(45deg); }
  .right { margin-left: auto; display: flex; align-items: center; gap: 12px; position: relative; }
  .btn { height: 36px; padding: 0 18px; border-radius: 6px; border: 1px solid transparent; font: 600 15px "Segoe UI", Arial; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn.light { background: #fff; color: var(--green-d); }
  .btn.primary { background: var(--green); color: #fff; }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .btn.danger { background: #fff; color: #c62828; border-color: #e57373; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: #ffcc80; color: #5d3a00; display: grid; place-items: center; font-weight: 700; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; overflow: hidden; position: relative; }
  aside.rightp { border-right: none; border-left: 1px solid var(--line); }
  h3 { margin: 0 0 12px; font-size: 16px; text-transform: uppercase; letter-spacing: .4px; color: var(--green-d); }
  .layer { display: flex; align-items: center; gap: 10px; padding: 8px 6px; font-size: 15px; border-bottom: 1px dashed #eee; }
  .chk { width: 18px; height: 18px; border: 2px solid var(--green); border-radius: 3px; display: grid; place-items: center; }
  .chk.on { background: var(--green); }
  .chk.on::after { content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .sw { width: 22px; height: 12px; border-radius: 2px; margin-left: auto; }
  .legend { margin-top: 22px; }
  .legend .row { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 5px 4px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; }
  .legend i { color: var(--muted); font-size: 13px; }
  main { position: relative; background: #dfe7d8; overflow: hidden; }
  canvas { display: block; }
  .nav { position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 6px; }
  .nav div { width: 40px; height: 40px; background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.25);
             display: grid; place-items: center; font: 600 20px "Segoe UI", Arial; color: #333; }
  .nav .small { font-size: 13px; }
  .scale { position: absolute; left: 16px; bottom: 14px; background: rgba(255,255,255,.85); padding: 4px 10px; border-radius: 4px; font-size: 13px; }
  .crs { position: absolute; right: 16px; bottom: 14px; background: rgba(255,255,255,.85); padding: 4px 10px; border-radius: 4px; font-size: 13px; }
  .popup { position: absolute; width: 300px; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.3); font-size: 14px; }
  .popup .hd { background: var(--green); color: #fff; padding: 9px 14px; border-radius: 8px 8px 0 0; font-weight: 600; font-size: 15px; display: flex; }
  .popup .hd span { margin-left: auto; opacity: .8; }
  .popup table { width: 100%; border-collapse: collapse; }
  .popup td { padding: 5px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  .popup td:first-child { color: var(--muted); width: 112px; }
  .popup::after { content: ""; position: absolute; left: -10px; top: 30px; border: 10px solid transparent; border-left: none; border-right-color: #fff; }
  select, .field input { width: 100%; height: 36px; border: 1px solid #c8cfc8; border-radius: 6px; padding: 0 10px; font: 15px "Segoe UI", Arial; background: #fff; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 18px; }
  .kpi { background: var(--green-l); border-radius: 8px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 22px; color: var(--green-d); }
  .kpi span { font-size: 13px; color: var(--muted); }
  .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .bar { display: grid; grid-template-columns: 116px 1fr 46px; align-items: center; gap: 8px; font-size: 13px; margin: 7px 0; }
  .bar .track { height: 14px; background: #eef2ee; border-radius: 3px; }
  .bar .fill { height: 100%; background: #81c784; border-radius: 3px; }
  .bar.sel .fill { background: var(--green); }
  .bar.sel { font-weight: 700; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 14px; line-height: 1.4; }
  .badge { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: var(--badge); color: #fff;
           font: 700 19px "Segoe UI", Arial; display: grid; place-items: center; box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.4); z-index: 80; }
  .hl { position: absolute; border: 3px solid var(--badge); border-radius: 8px; z-index: 75; pointer-events: none; }
  .dim { position: absolute; background: rgba(40,40,40,.45); z-index: 30; }
  /* quản trị */
  .adminbar { position: absolute; left: 16px; top: 16px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.25);
              display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .adminbar .tag { font-size: 13px; color: var(--admin); background: #fff3e0; border-radius: 4px; padding: 4px 8px; margin-right: 6px; }
  .adminbar .btn { height: 34px; }
  .btn.active { background: var(--admin); color: #fff; }
  .field { margin-bottom: 11px; font-size: 14px; }
  .field label { display: block; margin-bottom: 4px; color: var(--muted); }
  .field .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .alert { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; border-radius: 6px; padding: 9px 12px; font-size: 13.5px; margin: 6px 0 12px; }
  .alert b { display: block; }
  .actions { display: flex; gap: 10px; margin-top: 6px; }
  .pin { position: absolute; width: 22px; height: 22px; border-radius: 50% 50% 50% 0; background: var(--admin); transform: rotate(-45deg);
         box-shadow: 0 0 0 3px #fff; }
  /* đăng nhập */
  .modal-bg { position: absolute; inset: 0; background: rgba(20,30,20,.55); z-index: 60; display: grid; place-items: center; }
  .modal { width: 420px; background: #fff; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.4); padding: 26px 30px; }
  .modal h2 { margin: 0 0 4px; font-size: 22px; color: var(--green-d); }
  .modal p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><div class="leaf"></div><div>WebGIS 3D Cây xanh<small>Làng Đại học ĐHQG-HCM</small></div></div>
    <div class="search" id="c-search"><input value="" placeholder="Tìm theo mã cây hoặc loài cây…"><div class="ico"></div></div>
    <div class="right" id="c-account"></div>
  </header>

  <aside id="c-layers">
    <h3>Lớp dữ liệu</h3>
    <div class="layer"><div class="chk on"></div>Tòa nhà<div class="sw" style="background:#cfd3d8"></div></div>
    <div class="layer"><div class="chk on"></div>Đường giao thông<div class="sw" style="background:#9e9e9e"></div></div>
    <div class="layer"><div class="chk on"></div>Cây xanh<div class="sw" style="background:#4caf50"></div></div>
    <div class="layer"><div class="chk" id="chk-cover"></div>Vùng che phủ (tán)<div class="sw" style="background:rgba(56,142,60,.45)"></div></div>
    <div class="layer"><div class="chk on"></div>Ranh giới khu vực<div class="sw" style="border:2px dashed #1b5e20;height:12px"></div></div>
    <div class="legend">
      <h3>Chú giải loài cây</h3>
      <div id="legend"></div>
    </div>
  </aside>

  <main id="c-map">
    <canvas id="cv"></canvas>
    <div class="nav" id="c-nav"><div title="Về vị trí ban đầu">⌂</div><div>+</div><div>−</div><div class="small">2D</div><div>⟲</div></div>
    <div class="scale" id="scale"></div>
    <div class="crs">VN-2000 / UTM 48N (EPSG:3405)</div>
  </main>

  <aside class="rightp" id="c-right"></aside>
</div>

<script>
const SCENE = __SCENE__;
const STATS = __STATS__;
const SCREEN = new URLSearchParams(location.search).get('screen') || 'user';
const SPECIES = {1: ['Bàng', 'Terminalia catappa', '#6aa84f'], 2: ['Sao đen', 'Hopea odorata', '#2e6b30'],
                 3: ['Lim xẹt', 'Peltophorum pterocarpum', '#b5c934'], 4: ['Me tây', 'Albizia saman', '#3d9970']};
const SEL_ID = 25;
const fmt = (v, d = 0) => v.toLocaleString('vi-VN', {minimumFractionDigits: d, maximumFractionDigits: d});

// ---------- bảng chú giải ----------
document.getElementById('legend').innerHTML = Object.values(SPECIES).map(s =>
  `<div class="row"><div class="dot" style="background:${s[2]}"></div><div>${s[0]}<br><i>${s[1]}</i></div></div>`).join('');
if (SCREEN === 'cover') document.getElementById('chk-cover').classList.add('on');

// ---------- khung 3D: phép chiếu trục đo + thuật toán họa sĩ ----------
const main = document.getElementById('c-map');
const cv = document.getElementById('cv');
const W = main.clientWidth, H = main.clientHeight, DPR = 2;
cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const ctx = cv.getContext('2d'); ctx.scale(DPR, DPR);

const zoneTrees = SCENE.trees.filter(t => t.kv === 2);
let bx = [Infinity, -Infinity, Infinity, -Infinity];
for (const t of zoneTrees) { bx[0] = Math.min(bx[0], t.x); bx[1] = Math.max(bx[1], t.x); bx[2] = Math.min(bx[2], t.y); bx[3] = Math.max(bx[3], t.y); }
const cx0 = (bx[0] + bx[1]) / 2, cy0 = (bx[2] + bx[3]) / 2;
const TH = -32 * Math.PI / 180, EL = 42 * Math.PI / 180;     // góc xoay, góc nâng camera
const cosT = Math.cos(TH), sinT = Math.sin(TH), sinE = Math.sin(EL), cosE = Math.cos(EL);
function rot(x, y) { const dx = x - cx0, dy = y - cy0; return [dx * cosT - dy * sinT, dx * sinT + dy * cosT]; }
const SELT = SCENE.trees.find(t => t.id === SEL_ID);
const S = W / 330;                                            // khoảng 330 m theo chiều ngang khung nhìn
const [sa, sb] = rot(SELT.x, SELT.y);
const ox = W * 0.36 - sa * S, oy = H * 0.52 + sb * sinE * S;
function P(x, y, z = 0) { const [a, b] = rot(x, y); return [ox + a * S, oy - b * sinE * S - z * cosE * S]; }
function depth(x, y) { return rot(x, y)[1]; }        // lớn hơn = xa hơn

// nền và khu vực
ctx.fillStyle = '#e4ead9'; ctx.fillRect(0, 0, W, H);
function poly(pts, z, fill, stroke, lw = 1, dash = null) {
  ctx.beginPath(); pts.forEach((p, i) => { const [sx, sy] = P(p[0], p[1], z); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); }); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]); }
}
SCENE.zone.rings.forEach(r => poly(r, 0, '#d3e4c0', null));

// đường
const RW = {tertiary: 9, tertiary_link: 7, residential: 7, unclassified: 7, road: 6, service: 5, track: 3, footway: 2.2, cycleway: 2.2, platform: 2};
for (const r of SCENE.roads.sort((a, b) => (RW[a.hw] || 4) - (RW[b.hw] || 4))) {
  ctx.beginPath(); r.pts.forEach((p, i) => { const [sx, sy] = P(p[0], p[1]); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
  const w = (RW[r.hw] || 4) * S;
  ctx.strokeStyle = w > 4 ? '#b9b9b4' : '#cfc9bb'; ctx.lineWidth = Math.max(1.2, w); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  if (w > 4) { ctx.strokeStyle = '#f4f3ef'; ctx.lineWidth = w - 2.5; ctx.stroke(); }
}
SCENE.zone.rings.forEach(r => poly(r, 0, null, '#1b5e20', 2.5, [10, 7]));

// vùng che phủ (chế độ bật lớp)
if (SCREEN === 'cover') {
  ctx.fillStyle = 'rgba(46,125,50,.42)';
  for (const t of SCENE.trees) { const [sx, sy] = P(t.x, t.y); ctx.beginPath(); ctx.ellipse(sx, sy, t.r * S, t.r * S * sinE, 0, 0, 2 * Math.PI); ctx.fill(); }
}

// vật thể 3D: tòa nhà (lăng trụ) và cây (thân trụ + tán ellipsoid), vẽ từ xa đến gần
const objs = [];
for (const b of SCENE.buildings) for (const ring of b.rings) {
  let mx = 0, my = 0; ring.forEach(p => { mx += p[0]; my += p[1]; }); mx /= ring.length; my /= ring.length;
  objs.push({kind: 'b', d: depth(mx, my), ring, h: Math.min(b.h, 45)});
}
for (const t of SCENE.trees) objs.push({kind: 't', d: depth(t.x, t.y), t});
objs.sort((a, b) => b.d - a.d);

function shade(hex, f) { const n = parseInt(hex.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v * f)))); return `rgb(${c})`; }
let selScreen = null;
for (const o of objs) {
  if (o.kind === 'b') {
    const r = o.ring, walls = [];
    for (let i = 0; i < r.length - 1; i++) {
      const a = r[i], b = r[i + 1];
      const nx = b[1] - a[1], ny = -(b[0] - a[0]);                // pháp tuyến ngoài (giả định ring CCW)
      walls.push({a, b, d: depth((a[0] + b[0]) / 2, (a[1] + b[1]) / 2), lum: 0.78 + 0.18 * Math.cos(Math.atan2(ny, nx) - 0.9)});
    }
    walls.sort((p, q) => q.d - p.d);
    for (const w of walls) poly([w.a, w.b], 0, null, null);
    for (const w of walls) {
      const p1 = P(w.a[0], w.a[1]), p2 = P(w.b[0], w.b[1]), p3 = P(w.b[0], w.b[1], o.h), p4 = P(w.a[0], w.a[1], o.h);
      ctx.beginPath(); ctx.moveTo(...p1); ctx.lineTo(...p2); ctx.lineTo(...p3); ctx.lineTo(...p4); ctx.closePath();
      ctx.fillStyle = shade('#d9d6cf', w.lum); ctx.fill(); ctx.strokeStyle = 'rgba(90,90,90,.35)'; ctx.lineWidth = .6; ctx.stroke();
    }
    poly(r, o.h, '#efece6', 'rgba(90,90,90,.5)', .8);
  } else {
    const t = o.t, col = SPECIES[t.loai][2], hc = 0.75 * t.h, trunkTop = t.h - hc;
    const [gx, gy] = P(t.x, t.y), [, ty] = P(t.x, t.y, trunkTop + hc * 0.25);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(gx + 4, gy + 2, t.r * S * .9, t.r * S * sinE * .9, 0, 0, 2 * Math.PI); ctx.fill();
    const tw = Math.max(2, t.dbh / 100 * S * 1.6);
    ctx.fillStyle = '#7b5a3c'; ctx.fillRect(gx - tw / 2, ty, tw, gy - ty);
    const [cxs, cys] = P(t.x, t.y, trunkTop + hc / 2);
    const rx = t.r * S, ry = S * Math.sqrt((t.r * sinE) ** 2 + (hc / 2 * cosE) ** 2);
    const g = ctx.createRadialGradient(cxs - rx * .35, cys - ry * .4, rx * .1, cxs, cys, Math.max(rx, ry));
    g.addColorStop(0, shade(col, 1.35)); g.addColorStop(.7, col); g.addColorStop(1, shade(col, .7));
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cxs, cys, rx, ry, 0, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = shade(col, .6); ctx.lineWidth = .8; ctx.stroke();
    if (t.id === SEL_ID && SCREEN !== 'admin') {
      ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(cxs, cys, rx + 3, ry + 3, 0, 0, 2 * Math.PI); ctx.stroke();
      selScreen = [cxs + rx + 4, cys];
    }
  }
}
// thước tỉ lệ
const m50 = 50 * S; document.getElementById('scale').innerHTML = `<span style="display:inline-block;width:${m50.toFixed(0)}px;border-bottom:3px solid #333;margin-right:8px"></span>50 m (tỉ lệ tại tâm)`;

// ---------- panel phải và tài khoản ----------
const acc = document.getElementById('c-account'), right = document.getElementById('c-right');
const z2 = STATS.find(s => s.ma === 2), maxC = Math.max(...STATS.map(s => s.che_phu));
const shortName = n => n.replace('Khu phía Tây', 'Phía Tây').replace('Khu ', '').replace('Trung tâm Marie Curie - Isaac Newton', 'Trung tâm MC-IN').replace('Quảng trường Sáng tạo', 'QT Sáng tạo');
if (SCREEN !== 'admin') {
  acc.innerHTML = '<button class="btn light" id="c-login">Đăng nhập quản trị</button>';
  right.innerHTML = `<h3>Thống kê che phủ</h3>
    <select><option>${z2.ten}</option></select>
    <div class="kpis">
      <div class="kpi"><b>${z2.n}</b><span>Số cây</span></div>
      <div class="kpi"><b>${fmt(z2.mat_do, 2)}</b><span>Mật độ (cây/ha)</span></div>
      <div class="kpi"><b>${fmt(z2.che_phu, 2)} %</b><span>Tỷ lệ che phủ</span></div>
      <div class="kpi"><b>${fmt(z2.the_tich)}</b><span>Thể tích tán (m³)</span></div>
    </div>
    <div class="chart-title">Tỷ lệ che phủ theo khu vực (%)</div>
    ${STATS.map(s => `<div class="bar ${s.ma === 2 ? 'sel' : ''}"><span>${shortName(s.ten)}</span><div class="track"><div class="fill" style="width:${(s.che_phu / maxC * 100).toFixed(1)}%"></div></div><span>${fmt(s.che_phu, 2)}</span></div>`).join('')}
    <div class="note">Diện tích khu: ${fmt(z2.ha, 2)} ha · Diện tích tán (đã Dissolve): ${fmt(z2.tan_m2)} m².<br>Số liệu tính từ dữ liệu mẫu hiện có (cây mẫu, thuộc tính giả định), chỉ minh họa cách hiển thị.</div>`;
} else {
  acc.innerHTML = '<div class="user-chip"><div class="avatar">A</div>Quản trị viên · ttb</div><button class="btn light">Đăng xuất</button>';
  right.innerHTML = `<h3>Thêm cây xanh</h3>
    <div class="field"><label>Vị trí (nhấp trên bản đồ)</label><input value="X = 696 640,2   Y = 1 203 120,5"></div>
    <div class="field"><label>Loài cây</label><select><option>Bàng (Terminalia catappa)</option></select></div>
    <div class="field"><div class="row2"><div><label>Chiều cao H (m)</label><input value="8,5"></div><div><label>Bán kính tán R (m)</label><input value="3,2"></div></div></div>
    <div class="field"><div class="row2"><div><label>DBH (cm)</label><input value="18,0"></div><div><label>Ngày trồng</label><input value="15/03/2021"></div></div></div>
    <div class="field"><label>Tình trạng</label><select><option>Bình thường</option></select></div>
        <div class="field"><label>Khu vực (tự gán theo vị trí)</label><input value="Khu Trung tâm Marie Curie - Isaac Newton ✓ thuộc khu phụ trách" readonly></div>
    <div class="actions"><button class="btn primary">Lưu</button><button class="btn ghost">Hủy</button></div>`;
  const bar = document.createElement('div'); bar.className = 'adminbar'; bar.id = 'c-admin';
  bar.innerHTML = '<span class="tag">Khu phụ trách: Trung tâm MC–IN, Đông Nam</span><button class="btn active">＋ Thêm cây</button><button class="btn ghost">✎ Sửa</button><button class="btn danger">✕ Xóa</button>';
  main.appendChild(bar);
  const pin = document.createElement('div'); pin.className = 'pin'; const [px, py] = P(696640.2, 1203120.5);
  pin.style.left = (px - 11) + 'px'; pin.style.top = (py - 26) + 'px'; main.appendChild(pin);
}

// cửa sổ thông tin cây
if (selScreen && SCREEN === 'user') {
  const t = SCENE.trees.find(t => t.id === SEL_ID), sp = SPECIES[t.loai];
  const [yy, mm, dd] = t.ngay_trong.split('/'), age = 2026 - +yy;
  const pop = document.createElement('div'); pop.className = 'popup'; pop.id = 'c-popup';
  pop.innerHTML = `<div class="hd">Cây #${t.id}<span>✕</span></div><table>
    <tr><td>Loài</td><td>${sp[0]} (<i>${sp[1]}</i>)</td></tr>
    <tr><td>Chiều cao</td><td>${fmt(t.h, 1)} m</td></tr>
    <tr><td>Bán kính tán</td><td>${fmt(t.r, 1)} m</td></tr>
    <tr><td>DBH</td><td>${fmt(t.dbh, 1)} cm</td></tr>
    <tr><td>Ngày trồng</td><td>${dd}/${mm}/${yy} (≈ ${age} tuổi)</td></tr>
    <tr><td>Tình trạng</td><td>${t.tt}</td></tr>
    <tr><td>Khu vực</td><td>${SCENE.zone.name}</td></tr></table>`;
  pop.style.left = (selScreen[0] + 12) + 'px'; pop.style.top = (selScreen[1] - 40) + 'px';
  main.appendChild(pop);
}

// hộp đăng nhập
if (SCREEN === 'login') {
  const m = document.createElement('div'); m.className = 'modal-bg';
  m.innerHTML = `<div class="modal" id="c-loginbox"><h2>Đăng nhập quản trị</h2><p>Dành cho cán bộ quản lý cây xanh được phân công khu vực.</p>
    <div class="field"><label>Tên đăng nhập</label><input value="ttb"></div>
    <div class="field"><label>Mật khẩu</label><input type="password" value="matkhau123"></div>
    <div class="alert" style="margin-top:10px"><b>Đăng nhập thất bại</b>Sai tên đăng nhập, mật khẩu hoặc tài khoản đã bị khóa.</div>
    <div class="actions"><button class="btn primary" style="flex:1;justify-content:center">Đăng nhập</button><button class="btn ghost">Hủy</button></div></div>`;
  document.getElementById('app').appendChild(m);
}

// ---------- đánh số thành phần ----------
const app = document.getElementById('app').getBoundingClientRect();
function mark(id, n, opt = {}) {
  const el = document.getElementById(id); if (!el) return;
  const r = el.getBoundingClientRect(), pad = opt.pad ?? 4;
  const hl = document.createElement('div'); hl.className = 'hl';
  Object.assign(hl.style, {left: (r.left - app.left - pad) + 'px', top: (r.top - app.top - pad) + 'px', width: (r.width + 2 * pad) + 'px', height: (r.height + 2 * pad) + 'px'});
  const b = document.createElement('div'); b.className = 'badge'; b.textContent = n;
  const bx = opt.at === 'tr' ? r.right - app.left - 52 : r.left - app.left - 18 + (opt.dx || 0);
  Object.assign(b.style, {left: bx + 'px', top: (r.top - app.top - 18 + (opt.dy || 0)) + 'px'});
  if (!opt.nobox) document.getElementById('app').append(hl);
  document.getElementById('app').append(b);
}
if (SCREEN === 'user' || SCREEN === 'cover') {
  mark('c-map', 1, {pad: -4, nobox: true, dx: 34, dy: 34});
  mark('c-search', 2, {dy: 2}); mark('c-layers', 3, {pad: -3, at: 'tr', dy: 26}); mark('c-right', 4, {pad: -3, at: 'tr', dy: 26});
  mark('c-popup', 5); mark('c-nav', 6, {dx: -24}); mark('c-login', 8);
} else if (SCREEN === 'admin') {
  mark('c-admin', 7); mark('c-right', 9, {pad: -3, at: 'tr', dy: 26});
  for (const [l, t, w, h] of [[0, 60, 270, 900]]) { const d = document.createElement('div'); d.className = 'dim'; Object.assign(d.style, {left: l + 'px', top: t + 'px', width: w + 'px', height: h + 'px'}); document.getElementById('app').append(d); }
} else if (SCREEN === 'login') {
  mark('c-loginbox', 8, {pad: 2});
}
window.READY = true;
</script>
